services:
  web:
    # Dev-mode frontend: runs the Vite dev server from the bind-mounted source so
    # edits appear without rebuilding anything.
    image: node:22-alpine
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000",
      ]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  web_node_modules:
